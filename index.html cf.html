<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Naija Fresher 3D</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="games.css">
</head>
<body>

<div id="err"></div>
<div id="start"><h1>Naija <b>Fresher</b> 3D</h1><div>Walking test: a real 3D campus, a person who walks like a person.</div><div class="row"><button data-g="m">👦 Boy</button><button data-g="f">👧 Girl</button></div><div id="loadmsg" style="opacity:.7;font-size:13px">Loading 3D engine…</div></div>
<div class="chip" id="title">Naija <b>Fresher</b> · 3D</div>
<div class="chip" id="fps">…</div>
<div class="chip" id="hint">Left thumb: walk · Drag: look · Pinch: zoom · Meet people to say hi</div>
<div class="chip" id="place"></div><div class="chip" id="money">₦18,500 · 👥 0 friends</div><canvas id="mini" width="224" height="224"></canvas><div id="card"></div><div id="toast"></div>
<div id="joy"><div id="knob"></div></div>
<div class="btns"><button class="btn" id="bphone">📱 Phone<span id="phbadge"></span></button><button class="btn" id="bfree">🧭 Free map</button><div class="sprow"><button class="btn mini" id="bslow">−</button><button class="btn" id="bsprint">🚶 Walk</button><button class="btn mini" id="bfast">+</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="phone.js"></script>
<script src="game.js"></script>
<script src="games.js"></script>
<script src="life.js"></script>
</body>
</html>
